name: "Prämien-Tracker"
version: "2.52.2"
slug: "praemien_tracker"
description: "Private Übersicht und Verwaltung von Bank-Prämien-Deals"
url: "https://github.com/lolap92/praemien-tracker"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:cash-multiple
panel_title: "Prämien-Tracker"
homeassistant_api: true
hassio_api: true
map:
  - type: addon_config
    read_only: false
options:
  demo_modus: false
  anthropic_api_key: ""
  anthropic_model: "claude-haiku-4-5"
  mindestpraemie: 50
  mydealz_gruppe: "vertraege-finanzen,konto-kreditkarten"
  spartanien_url: "https://www.spartanien.de/"
  dealdoktor_feed_url: "https://www.dealdoktor.de/bonus-deals/feed/,https://www.dealdoktor.de/themenwelten/banken-versicherung/feed/"
  benachrichtigungen_aktiv: true
  benachrichtigungsgeraete: "notify"
  taeglicher_lauf_aktiv: true
  kuendigung_hinweise_batch_aktiv: true
schema:
  demo_modus: "bool"
  anthropic_api_key: "password"
  anthropic_model: "str"
  # Untergrenze 0: eine negative Mindestprämie ergäbe keinen Sinn und würde
  # jeden Fund als "vorgeschlagen" durchlassen.
  mindestpraemie: "float(0,)"
  # mydealz_gruppe und dealdoktor_feed_url sind bewusst "str", keine Liste: es
  # sind kommagetrennte Freitext-Felder (mehrere Gruppen/Feeds in einem Feld,
  # siehe config.py). Ein "url"-Typ verlangte genau eine URL, ein list()-Typ
  # änderte das options.json-Format und bräche das Komma-Parsen.
  mydealz_gruppe: "str"
  spartanien_url: "url"
  dealdoktor_feed_url: "str"
  benachrichtigungen_aktiv: "bool"
  benachrichtigungsgeraete: "str"
  taeglicher_lauf_aktiv: "bool"
  kuendigung_hinweise_batch_aktiv: "bool"
