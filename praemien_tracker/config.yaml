name: "Prämien-Tracker"
version: "2.3.1"
slug: "praemien_tracker"
description: "Private Übersicht und Verwaltung von Bank-Prämien-Deals"
url: "https://github.com/lolap92/praemien-tracker"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:cash-multiple
panel_title: "Prämien-Tracker"
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  anthropic_api_key: ""
  anthropic_model: "claude-haiku-4-5"
  mindestpraemie: 50
  mydealz_gruppe: "vertraege-finanzen"
  spartanien_url: "https://www.spartanien.de/themen/bankprodukte/"
  benachrichtigungen_aktiv: true
  notify_dienst: "notify"
schema:
  anthropic_api_key: "password"
  anthropic_model: "str"
  mindestpraemie: "float"
  mydealz_gruppe: "str"
  spartanien_url: "url"
  benachrichtigungen_aktiv: "bool"
  notify_dienst: "str"
