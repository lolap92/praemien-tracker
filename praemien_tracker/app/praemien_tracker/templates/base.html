<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Prämien-Tracker{% endblock %}</title>
<base href="{{ request.headers.get('X-Ingress-Path', '') }}/">
<link rel="stylesheet" href="static/css/style.css?v={{ asset_v }}">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Prämien-Tracker</h1>
    {% set tab = nav_tab(request) %}
    <nav class="tabs">
      <a href="overview" class="{{ 'active' if tab == 'overview' else '' }}">Übersicht</a>
      <a href="todos" class="{{ 'active' if tab == 'todos' else '' }}">Zu erledigen</a>
      <a href="deals" class="{{ 'active' if tab == 'deals' else '' }}">Deals</a>
      <a href="deals/new" class="{{ 'active' if tab == 'deals/new' else '' }}">Neuer Deal</a>
      <a href="vorschlaege" class="{{ 'active' if tab == 'vorschlaege' else '' }}">Vorschläge</a>
      <a href="completeness" class="{{ 'active' if tab == 'completeness' else '' }}">Vollständigkeit</a>
      <a href="sperrfristen" class="{{ 'active' if tab == 'sperrfristen' else '' }}">Sperrfristen</a>
      <a href="protokoll" class="{{ 'active' if tab == 'protokoll' else '' }}">Protokoll</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
